[package]
name = "envy-linux"
version = "1.8.1-beta"
description = "A flat-file, frictionless note-taking application for Linux"
authors = ["Skyler Schoos"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "envy_linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
envy-core = { path = "../crates/envy-core" }
dirs = "5"
chrono = "0.4"

[dev-dependencies]
# Only for the test that reads this file's own source and refuses a new command
# that takes a raw `path: String` without review. Already in the lockfile.
regex = "1"

[target.'cfg(windows)'.dependencies]
# The updater has a release channel only on Windows; see RELEASING.md.
tauri-plugin-updater = "2"
# Matches the version Tauri already pulls in, so its HWND type lines up with
# `WebviewWindow::hwnd()`. Used to restack the window on the Windows Z-order —
# clearing the topmost flag alone leaves the window above the app you're using.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

